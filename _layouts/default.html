<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.lang == 'en' %}{{ page.title }} · {{ site.title }}{% elsif page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page">
    <nav class="langbar" aria-label="Language">
      <a href="{{ '/' | relative_url }}"{% unless page.lang == 'zh' %} class="current"{% endunless %}>EN</a>
      <span class="slash">/</span>
      <a href="{{ '/zh/' | relative_url }}"{% if page.lang == 'zh' %} class="current"{% endif %}>中文</a>
    </nav>

    <main class="content">
{{ content }}
    </main>

    <footer class="site-footer">
      <p class="name">Peng Liu · StormstoutLau</p>
      <p class="links">
        <a href="mailto:peng.liu.john@gmail.com">peng.liu.john@gmail.com</a>
        <span class="sep">·</span>
        <a href="https://github.com/StormstoutLau">GitHub</a>
        <span class="sep">·</span>
        <a href="https://orcid.org/0009-0008-7493-6473">ORCID 0009-0008-7493-6473</a>
      </p>
    </footer>
  </div>
</body>
</html>
